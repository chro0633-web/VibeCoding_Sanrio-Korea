<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 하반기 한미그룹 공개채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* ---------- Reset & Variables ---------- */
  :root {
    --red: #E60012;
    --orange: #FF5D32;
    --black: #000000;
    --white: #FFFFFF;
    --font: 'Inter', 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    --container: 1440px;
    --transition: 0.2s ease;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    min-width: var(--container);
  }
  ul { margin: 0; padding: 0; list-style: none; }
  h1, h2, p { margin: 0; }
  a { color: inherit; text-decoration: none; transition: color var(--transition); }
  img { display: block; }

  /* 링크 hover: 레드 */
  .link:hover, .link:focus-visible { color: var(--red); }

  /* ---------- Header ---------- */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 10;
  }
  .header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: var(--container);
    height: 100px;
    margin: 0 auto;
    padding: 0 60px;
  }
  .header__logo { display: block; width: 182px; height: 31px; }
  .header__logo img { width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; height: 100px; }
  .gnb__list { display: flex; gap: 40px; height: 100px; }
  .gnb__link {
    display: flex;
    align-items: center;
    height: 100px;
    font-size: 19.2px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }
  .gnb__cta { padding-left: 40px; }

  /* ---------- Buttons ---------- */
  .btn {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
    border-radius: 500px;
    color: var(--white);
    font-family: var(--font);
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    transition: color var(--transition), background-color var(--transition), border-color var(--transition);
  }
  /* 지원하기 (헤더) */
  .btn--header {
    gap: 10px;
    height: 48px;
    padding: 11.5px 18px 12.5px;
    background: var(--red);
    font-size: 17.4px;
    line-height: 18px;
    letter-spacing: -0.36px;
  }
  .btn--header svg { width: 7px; height: 12px; flex: none; }
  /* 모집직무 바로가기 (히어로 CTA) — 그라데이션은 ::before opacity로 트랜지션 */
  .btn--cta {
    width: 303px;
    height: 72px;
    padding: 16.7px 62px 17.3px;
    background: var(--white);
    font-size: 22.7px;
    line-height: 34px;
    letter-spacing: -0.48px;
  }
  .btn--cta::before {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: -1;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%);
    transition: opacity var(--transition);
  }
  /* 버튼 hover: 흰색 ↔ 레드 반전 */
  .btn--header:hover, .btn--header:focus-visible,
  .btn--cta:hover, .btn--cta:focus-visible {
    background: var(--white);
    border-color: var(--red);
    color: var(--red);
  }
  .btn--cta:hover::before, .btn--cta:focus-visible::before { opacity: 0; }
  .btn svg path { stroke: currentColor; transition: stroke var(--transition); }

  /* ---------- Main Visual ---------- */
  .main-visual {
    position: relative;
    height: 900px;
    min-height: 720px;
    overflow: hidden;
    background: url('./images/mv_bg.png') center / cover no-repeat;
  }
  .main-visual__inner {
    position: relative;
    display: flex;
    align-items: center;
    max-width: var(--container);
    height: 100%;
    margin: 0 auto;
  }

  /* 텍스트 영역 */
  .mv-text {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 80px;
    width: 560px;
    margin-left: 100px;
  }
  .mv-text__head { display: flex; flex-direction: column; gap: 31.9px; }
  .mv-eyebrow {
    font-size: 31.1px;
    font-weight: 700;
    line-height: 45px;
    letter-spacing: -0.64px;
  }
  .mv-title { display: flex; flex-direction: column; }
  .mv-title__em {
    font-size: 72.3px;
    font-weight: 800;
    line-height: 76px;
    letter-spacing: -1.76px;
  }
  .mv-title__sub {
    font-size: 45.8px;
    font-weight: 800;
    line-height: 72px;
    letter-spacing: -1.12px;
  }
  .mv-period {
    font-size: 19.2px;
    font-weight: 500;
    line-height: 28px;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }

  /* 링 */
  .mv-ring {
    position: absolute;
    border-radius: 500px;
    pointer-events: none;
  }
  .mv-ring--glow {
    z-index: 1;
    left: 700px; top: 118px;
    width: 663px; height: 663px;
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    border: 5px solid var(--white);
    filter: blur(5px);
  }
  .mv-ring--line {
    z-index: 2;
    left: 755px; top: 173px;
    width: 553px; height: 553px;
    border: 1px solid rgba(255,255,255,0.5);
  }

  /* 캐릭터 스테이지 (1689.6 x 844.8, 피그마 좌표 기준) */
  .mv-stage {
    position: absolute;
    z-index: 2;
    right: -153px;
    top: calc(50% - 422.4px);
    width: 1689.6px;
    height: 844.8px;
    pointer-events: none;
  }
  .mv-stage img { position: absolute; display: block; }
  .mv-micro  { left: 862.4px;  top: 124.08px; width: 289.52px; height: 221.76px; }
  .mv-char1  { left: 911.68px; top: 267.52px; width: 253.44px; height: 395.12px; }
  .mv-char2  { left: 1133.44px; top: 265.76px; width: 181.28px; height: 381.04px; }
  .mv-char3  { left: 836px;    top: 441.76px; width: 216.48px; height: 262.24px; }
  .mv-char4  { left: 1192.4px; top: 462.88px; width: 292.16px; height: 206.8px; }
  .mv-star1  { left: 1018.16px; top: 209.44px; width: 17.6px;  height: 16.72px; }
  .mv-star2  { left: 836.88px;  top: 441.76px; width: 22.88px; height: 23.76px; }
  .mv-star3a { left: 1411.52px; top: 447.04px; width: 21.12px; height: 21.12px; }
  .mv-star3b { left: 1429.12px; top: 404.8px;  width: 34.32px; height: 35.2px; }
  .mv-star4  { left: 1257.52px; top: 221.76px; width: 23.76px; height: 24.64px; }

  /* 스크롤 버튼 */
  .scroll-btn {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px; height: 80px;
    padding: 0;
    border: 0;
    border-radius: 500px;
    background: rgba(255,255,255,0.1);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    cursor: pointer;
    transition: background-color var(--transition);
  }
  .scroll-btn::before {  /* Gradient + Border */
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 500px;
    background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }
  .scroll-btn:hover, .scroll-btn:focus-visible { background: rgba(255,255,255,0.35); }
  .scroll-btn svg { width: 40px; height: 40px; }

  /* ---------- 하위 섹션 (앵커 대상) ---------- */
  .section {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 600px;
    scroll-margin-top: 0;
  }
  .section:nth-of-type(even) { background: #FFF5F2; }
  .section__title { font-size: 45.8px; font-weight: 800; letter-spacing: -1.12px; }
  .footer {
    padding: 48px 60px;
    background: #111;
    color: #aaa;
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <a class="header__logo" href="./" aria-label="한미그룹 홈">
      <img src="./images/기본.svg" alt="Hanmi 한미그룹" width="182" height="31">
    </a>

    <nav class="gnb" aria-label="주요 메뉴">
      <ul class="gnb__list">
        <li><a class="gnb__link link" href="#job">직무소개</a></li>
        <li><a class="gnb__link link" href="#apply">지원자격 및 접수방법</a></li>
        <li><a class="gnb__link link" href="#schedule">채용설명회 일정</a></li>
      </ul>
      <div class="gnb__cta">
        <a class="btn btn--header" href="#apply">
          지원하기
          <svg viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="main-visual" aria-label="메인 비주얼">
    <div class="main-visual__inner">
      <div class="mv-ring mv-ring--glow" aria-hidden="true"></div>
      <div class="mv-ring mv-ring--line" aria-hidden="true"></div>

      <div class="mv-text">
        <div class="mv-text__head">
          <p class="mv-eyebrow">2026년 하반기</p>
          <h1 class="mv-title">
            <span class="mv-title__em">한미그룹</span>
            <span class="mv-title__sub">공개채용</span>
          </h1>
          <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <a class="btn btn--cta" href="#job">모집직무 바로가기!</a>
      </div>

      <div class="mv-stage" aria-hidden="true">
        <img class="mv-micro"  src="./images/mv_micro_png.svg"   alt="">
        <img class="mv-char1"  src="./images/mv_char1_png.svg"   alt="">
        <img class="mv-char2"  src="./images/mv_char2_png.svg"   alt="">
        <img class="mv-char3"  src="./images/mv_char3_png.svg"   alt="">
        <img class="mv-char4"  src="./images/mv_char4_png.svg"   alt="">
        <img class="mv-star1"  src="./images/mv_star1_png.svg"   alt="">
        <img class="mv-star2"  src="./images/mv_star2_png.svg"   alt="">
        <img class="mv-star3a" src="./images/mv_star3_png.svg"   alt="">
        <img class="mv-star3b" src="./images/mv_star3_png-1.svg" alt="">
        <img class="mv-star4"  src="./images/mv_star4_png.svg"   alt="">
      </div>
    </div>

    <button class="scroll-btn" type="button" aria-label="아래로 스크롤" data-scroll-target="#job">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M12 16l8 8 8-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <!-- 하위 섹션: 디자인 시안에 없는 앵커 연결용 자리 -->
  <section class="section" id="job"><h2 class="section__title">직무소개</h2></section>
  <section class="section" id="apply"><h2 class="section__title">지원자격 및 접수방법</h2></section>
  <section class="section" id="schedule"><h2 class="section__title">채용설명회 일정</h2></section>
</main>

<footer class="footer">
  <p>© Hanmi Group. All rights reserved.</p>
</footer>

<script>
  // 스크롤 버튼 + 앵커 부드러운 이동
  (function () {
    var btn = document.querySelector('.scroll-btn');
    if (btn) {
      btn.addEventListener('click', function () {
        var target = document.querySelector(btn.getAttribute('data-scroll-target'));
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      });
    }
  })();
</script>
</body>
</html>
