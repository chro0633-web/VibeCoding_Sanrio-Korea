<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026년 하반기 한미그룹 공개채용</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      /* ---------- Reset & Variables ---------- */
      /* CSS 변수 구역 */
      /* :root{변수코드} 
        1. 변수 설정 방법
        --변수명: 값; 
        변수명은 케밥 케이스로 주로 씀
        2. 변수 호출 방법
        var(변수명) -> 쓰고 싶은 곳에 값으로 사용 */
      :root {
        --red: #e60012;
        --orange: #ff5d32;
        --black: #000000;
        --white: #ffffff;
        --font:
          "Inter", "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
        --container: 1440px;
        --transition: 0.2s ease;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--black);
        background: var(--white);
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
        /* min-width: var(--container); */
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
        transition: color var(--transition);
      }
      img {
        display: block;
      }

      /* 링크 hover: 레드 */
      .link:hover,
      .link:focus-visible {
        color: var(--red);
      }

      /* ---------- Header ---------- */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100px;
        z-index: 10;
      }
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: var(--container);
        height: 100px;
        margin: 0 auto;
        padding: 0 60px;
      }
      .header__logo {
        display: block;
        width: 182px;
        height: 31px;
      }
      .header__logo img {
        width: 182px;
        height: 31px;
      }

      .gnb {
        display: flex;
        align-items: center;
        height: 100px;
      }
      .gnb__list {
        display: flex;
        gap: 40px;
        height: 100px;
      }
      .gnb__link {
        display: flex;
        align-items: center;
        height: 100px;
        font-size: 19.2px;
        font-weight: 600;
        line-height: 20px;
        letter-spacing: -0.4px;
        white-space: nowrap;
      }
      .gnb__cta {
        padding-left: 40px;
      }

      /* ---------- Buttons ---------- */
      .btn {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid transparent;
        border-radius: 500px;
        color: var(--white);
        font-family: var(--font);
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        cursor: pointer;
        transition:
          color var(--transition),
          background-color var(--transition),
          border-color var(--transition);
      }
      /* 지원하기 (헤더) */
      .btn--header {
        gap: 10px;
        height: 48px;
        padding: 11.5px 18px 12.5px;
        background: var(--red);
        font-size: 17.4px;
        line-height: 18px;
        letter-spacing: -0.36px;
      }
      .btn--header svg {
        width: 7px;
        height: 12px;
        flex: none;
      }
      /* 모집직무 바로가기 (히어로 CTA) — 그라데이션은 ::before opacity로 트랜지션 */
      .btn--cta {
        width: 303px;
        height: 72px;
        padding: 16.7px 62px 17.3px;
        background: var(--white);
        font-size: 22.7px;
        line-height: 34px;
        letter-spacing: -0.48px;
      }
      .btn--cta::before {
        content: "";
        position: absolute;
        inset: -2px;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%);
        transition: opacity var(--transition);
      }
      /* 버튼 hover: 흰색 ↔ 레드 반전 */
      .btn--header:hover,
      .btn--header:focus-visible,
      .btn--cta:hover,
      .btn--cta:focus-visible {
        background: var(--white);
        border-color: var(--red);
        color: var(--red);
      }
      .btn--cta:hover::before,
      .btn--cta:focus-visible::before {
        opacity: 0;
      }
      .btn svg path {
        stroke: currentColor;
        transition: stroke var(--transition);
      }

      /* ---------- Main Visual ---------- */
      .main-visual {
        position: relative;
        height: 900px;
        min-height: 720px;
        overflow: hidden;
        background: url("./images/mv_bg.png") center / cover no-repeat;
      }
      .main-visual__inner {
        position: relative;
        display: flex;
        align-items: center;
        max-width: var(--container);
        height: 100%;
        margin: 0 auto;
      }

      /* 텍스트 영역 */
      .mv-text {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 80px;
        width: 560px;
        margin-left: 100px;
      }
      .mv-text__head {
        display: flex;
        flex-direction: column;
        gap: 31.9px;
      }
      .mv-eyebrow {
        font-size: 31.1px;
        font-weight: 700;
        line-height: 45px;
        letter-spacing: -0.64px;
      }
      .mv-title {
        display: flex;
        flex-direction: column;
      }
      .mv-title__em {
        font-size: 72.3px;
        font-weight: 800;
        line-height: 76px;
        letter-spacing: -1.76px;
      }
      .mv-title__sub {
        font-size: 45.8px;
        font-weight: 800;
        line-height: 72px;
        letter-spacing: -1.12px;
      }
      .mv-period {
        font-size: 19.2px;
        font-weight: 500;
        line-height: 28px;
        letter-spacing: -0.4px;
        white-space: nowrap;
      }

      /* 링 */
      .mv-ring {
        position: absolute;
        border-radius: 500px;
        pointer-events: none;
      }
      .mv-ring--glow {
        z-index: 1;
        left: 700px;
        top: 118px;
        width: 663px;
        height: 663px;
        background: radial-gradient(
          70.71% 70.71% at 50% 50%,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        border: 5px solid var(--white);
        filter: blur(5px);
      }
      .mv-ring--line {
        z-index: 2;
        left: 755px;
        top: 173px;
        width: 553px;
        height: 553px;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      /* 캐릭터 스테이지 (1689.6 x 844.8, 피그마 좌표 기준) */
      .mv-stage {
        position: absolute;
        z-index: 2;
        right: -153px;
        top: calc(50% - 422.4px);
        width: 1689.6px;
        height: 844.8px;
        pointer-events: none;
      }
      .mv-stage img {
        position: absolute;
        display: block;
      }
      .mv-micro {
        left: 862.4px;
        top: 124.08px;
        width: 289.52px;
        height: 221.76px;
      }
      .mv-char1 {
        left: 911.68px;
        top: 267.52px;
        width: 253.44px;
        height: 395.12px;
      }
      .mv-char2 {
        left: 1133.44px;
        top: 265.76px;
        width: 181.28px;
        height: 381.04px;
      }
      .mv-char3 {
        left: 836px;
        top: 441.76px;
        width: 216.48px;
        height: 262.24px;
      }
      .mv-char4 {
        left: 1192.4px;
        top: 462.88px;
        width: 292.16px;
        height: 206.8px;
      }
      .mv-star1 {
        left: 1018.16px;
        top: 209.44px;
        width: 17.6px;
        height: 16.72px;
      }
      .mv-star2 {
        left: 836.88px;
        top: 441.76px;
        width: 22.88px;
        height: 23.76px;
      }
      .mv-star3a {
        left: 1411.52px;
        top: 447.04px;
        width: 21.12px;
        height: 21.12px;
      }
      .mv-star3b {
        left: 1429.12px;
        top: 404.8px;
        width: 34.32px;
        height: 35.2px;
      }
      .mv-star4 {
        left: 1257.52px;
        top: 221.76px;
        width: 23.76px;
        height: 24.64px;
      }

      /* 스크롤 버튼 */
      .scroll-btn {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        isolation: isolate;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        padding: 0;
        border: 0;
        border-radius: 500px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 4px 4px 10px rgba(255, 255, 255, 0.4),
          inset -4px -4px 10px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        cursor: pointer;
        transition: background-color var(--transition);
      }
      .scroll-btn::before {
        /* Gradient + Border */
        content: "";
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: 500px;
        background: linear-gradient(
          132.3deg,
          rgba(255, 255, 255, 0.8) 12.7%,
          rgba(255, 255, 255, 0) 86.3%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
      }
      .scroll-btn:hover,
      .scroll-btn:focus-visible {
        background: rgba(255, 255, 255, 0.35);
      }
      .scroll-btn svg {
        width: 40px;
        height: 40px;
      }

      /* ---------- 하위 섹션 (앵커 대상) ---------- */
      .section {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 600px;
        scroll-margin-top: 0;
      }
      .section:nth-of-type(even) {
        background: #fff5f2;
      }
      .section__title {
        font-size: 45.8px;
        font-weight: 800;
        letter-spacing: -1.12px;
      }
      .footer {
        padding: 48px 60px;
        background: #111;
        color: #aaa;
        font-size: 15px;
        text-align: center;
      }

      /* =====================================================
     Responsive
     - Desktop (1025px+): 위의 기본 스타일
     - Tablet  (391~1024px): @media (max-width: 1024px)
     - Mobile  (~390px)    : @media (max-width: 390px)
     ===================================================== */

      /* 모바일 전용 요소: 데스크탑/태블릿에서는 숨김 */
      .gnb__toggle,
      .m-menu {
        display: none;
      }

      /* ---------- Tablet ---------- */
      @media (max-width: 1024px) {
        body {
          min-width: 0;
        }

        .header,
        .header__inner,
        .gnb,
        .gnb__list,
        .gnb__link {
          height: 100px;
        }
        .header__inner {
          padding: 0 40px;
        }
        .header__logo,
        .header__logo img {
          width: 162px;
          height: 28px;
        }
        .gnb__list {
          gap: 24px;
        }
        .gnb__link {
          font-size: 16px;
        }
        .gnb__cta {
          padding-left: 24px;
        }

        .main-visual {
          height: 760px;
          min-height: 0;
        }
        .main-visual__inner {
          align-items: flex-start;
        }

        .mv-text {
          gap: 56px;
          width: auto;
          margin: 108px 0 0 40px;
        }
        .mv-text__head {
          gap: 22px;
        }
        .mv-eyebrow {
          font-size: 28px;
          line-height: 40px;
          letter-spacing: -0.58px;
        }
        .mv-title__em {
          font-size: 60px;
          line-height: 64px;
          letter-spacing: -1.5px;
        }
        .mv-title__sub {
          font-size: 38px;
          line-height: 60px;
          letter-spacing: -0.95px;
        }
        .mv-period {
          font-size: 19px;
          white-space: normal;
        }
        .btn--cta {
          width: 322px;
          height: 68px;
          font-size: 21px;
        }

        /* 캐릭터: 하단 중앙 배치, 아래쪽은 섹션 경계에서 잘림 (스테이지 0.75배 축소) */
        .mv-ring {
          display: none;
        }
        .mv-stage {
          right: auto;
          left: 50%;
          top: 410px;
          margin-left: calc(-1160px * 0.75);
          transform: scale(0.75);
          transform-origin: 0 0;
        }
        .scroll-btn {
          bottom: 50px;
        }
      }

      /* ---------- Mobile ---------- */
      @media (max-width: 768px) {
        .header,
        .header__inner,
        .gnb {
          height: 64px;
        }
        .header__inner {
          padding: 0 20px;
        }
        .header__logo,
        .header__logo img {
          width: 130px;
          height: 22px;
        }
        .gnb__list {
          display: none;
        }
        .gnb__cta {
          padding-left: 0;
        }
        .btn--header {
          height: 28px;
          padding: 0 14px;
          font-size: 12.5px;
          line-height: 14px;
          letter-spacing: -0.25px;
          border-width: 1px;
        }
        .btn--header svg {
          display: none;
        }

        /* 햄버거 버튼 */
        .gnb__toggle {
          display: block;
          width: 24px;
          height: 24px;
          margin-left: 14px;
          padding: 0;
          border: 0;
          background: none;
          color: var(--black);
          cursor: pointer;
        }
        .gnb__toggle svg,
        .m-menu__close svg {
          display: block;
          width: 24px;
          height: 24px;
        }

        .main-visual {
          height: 785px;
        }
        .mv-text {
          gap: 52px;
          width: auto;
          margin: 96px 0 0 20px;
        }
        .mv-text__head {
          gap: 14px;
        }
        .mv-eyebrow {
          font-size: 22px;
          line-height: 32px;
          letter-spacing: -0.45px;
        }
        .mv-title__em {
          font-size: 57px;
          line-height: 62px;
          letter-spacing: -1.4px;
        }
        .mv-title__sub {
          font-size: 36px;
          line-height: 52px;
          letter-spacing: -0.9px;
        }
        .mv-period {
          font-size: 13.5px;
          line-height: 20px;
          letter-spacing: -0.3px;
        }
        .btn--cta {
          width: 202px;
          height: 48px;
          padding: 0;
          font-size: 16px;
          line-height: 24px;
          letter-spacing: -0.34px;
        }

        /* 링: 캐릭터 뒤 중앙 */
        .mv-ring {
          display: block;
          left: 50%;
        }
        .mv-ring--glow {
          top: 400px;
          width: 360px;
          height: 360px;
          margin-left: -180px;
          border-width: 3px;
        }
        .mv-ring--line {
          top: 430px;
          width: 300px;
          height: 300px;
          margin-left: -150px;
        }

        .mv-stage {
          top: 397px;
          margin-left: calc(-1160px * 0.48);
          transform: scale(0.48);
        }
        .scroll-btn {
          bottom: 20px;
          width: 40px;
          height: 40px;
        }
        .scroll-btn svg {
          width: 20px;
          height: 20px;
        }

        /* 전체메뉴 패널: 오른쪽 → 왼쪽 슬라이드 */
        .m-menu {
          position: fixed;
          inset: 0;
          z-index: 100;
          display: block;
          overflow-y: auto;
          background: var(--white);
          transform: translateX(100%);
          visibility: hidden;
          transition:
            transform 0.3s ease,
            visibility 0s linear 0.3s;
        }
        .m-menu.is-open {
          transform: translateX(0);
          visibility: visible;
          transition: transform 0.3s ease;
        }
        .m-menu__head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 64px;
          padding: 0 20px;
        }
        .m-menu__close {
          width: 24px;
          height: 24px;
          padding: 0;
          border: 0;
          background: none;
          color: var(--black);
          cursor: pointer;
        }
        .m-menu__list {
          margin: 48px 20px 0;
        }
        .m-menu__list li {
          border-bottom: 1px solid #ebebeb;
        }
        .m-menu__link {
          display: block;
          padding: 20px 2px;
          font-size: 20px;
          font-weight: 700;
          line-height: 24px;
          letter-spacing: -0.4px;
        }
        .m-menu__cta {
          display: flex;
          width: auto;
          height: 52px;
          margin: 44px 20px 0;
          font-size: 18px;
          line-height: 24px;
          background: var(--red);
        }
        .m-menu__cta svg {
          width: 7px;
          height: 12px;
          margin-left: 10px;
        }
        .m-menu__char {
          position: absolute;
          right: 4px;
          bottom: 24px;
          width: 150px;
          height: auto;
          pointer-events: none;
        }
        html.is-menu-open,
        html.is-menu-open body {
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="header__logo" href="./" aria-label="한미그룹 홈">
          <img
            src="./images/기본.svg"
            alt="Hanmi 한미그룹"
            width="182"
            height="31"
          />
        </a>

        <nav class="gnb" aria-label="주요 메뉴">
          <ul class="gnb__list">
            <li><a class="gnb__link link" href="#job">직무소개</a></li>
            <li>
              <a class="gnb__link link" href="#apply">지원자격 및 접수방법</a>
            </li>
            <li>
              <a class="gnb__link link" href="#schedule">채용설명회 일정</a>
            </li>
          </ul>
          <div class="gnb__cta">
            <a class="btn btn--header" href="#apply">
              지원하기
              <svg viewBox="0 0 7 12" fill="none" aria-hidden="true">
                <path
                  d="M1 1l5 5-5 5"
                  stroke="#fff"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
          <button
            class="gnb__toggle"
            type="button"
            aria-label="전체메뉴 열기"
            aria-expanded="false"
            aria-controls="mMenu"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2 5h20M2 12h20M2 19h20"
                stroke="currentColor"
                stroke-width="1.6"
              />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <!-- 모바일 전체메뉴 -->
    <div class="m-menu" id="mMenu" aria-hidden="true">
      <div class="m-menu__head">
        <a class="header__logo" href="./" aria-label="한미그룹 홈"
          ><img
            src="./images/기본.svg"
            alt="Hanmi 한미그룹"
            width="130"
            height="22"
        /></a>
        <button class="m-menu__close" type="button" aria-label="전체메뉴 닫기">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 3l18 18M21 3L3 21"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
        </button>
      </div>
      <ul class="m-menu__list">
        <li><a class="m-menu__link link" href="#job">직무소개</a></li>
        <li>
          <a class="m-menu__link link" href="#apply">지원자격 및 접수방법</a>
        </li>
        <li>
          <a class="m-menu__link link" href="#schedule">채용설명회 일정</a>
        </li>
      </ul>
      <a class="btn btn--header m-menu__cta" href="#apply">
        지원하기
        <svg viewBox="0 0 7 12" fill="none" aria-hidden="true">
          <path
            d="M1 1l5 5-5 5"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
      <img class="m-menu__char" src="./images/mo_menu_char.png" alt="" />
    </div>

    <main>
      <section class="main-visual" aria-label="메인 비주얼">
        <div class="main-visual__inner">
          <div class="mv-ring mv-ring--glow" aria-hidden="true"></div>
          <div class="mv-ring mv-ring--line" aria-hidden="true"></div>

          <div class="mv-text">

    <script>
      // 스크롤 버튼 + 앵커 부드러운 이동
      (function () {
        var btn = document.querySelector(".scroll-btn");
        if (btn) {
          btn.addEventListener("click", function () {
            var target = document.querySelector(
              btn.getAttribute("data-scroll-target"),
            );
            if (target) target.scrollIntoView({ behavior: "smooth" });
          });
        }
      })();

      // 모바일 전체메뉴 열기/닫기
      (function () {
        var root = document.documentElement;
        var menu = document.getElementById("mMenu");
        var toggle = document.querySelector(".gnb__toggle");
        var closeBtn = document.querySelector(".m-menu__close");
        var mq = window.matchMedia("(max-width: 390px)");
        if (!menu || !toggle) return;

        function setOpen(open) {
          menu.classList.toggle("is-open", open);
          root.classList.toggle("is-menu-open", open);
          menu.setAttribute("aria-hidden", String(!open));
          toggle.setAttribute("aria-expanded", String(open));
          if (open && closeBtn) closeBtn.focus();
          if (!open && menu.contains(document.activeElement)) toggle.focus();
        }
        toggle.addEventListener("click", function () {
          setOpen(true);
        });
        if (closeBtn)
          closeBtn.addEventListener("click", function () {
            setOpen(false);
          });
        menu.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", function () {
            setOpen(false);
          });
        });
        // 메뉴 바깥(빈 영역) 클릭 시 닫기
        document.addEventListener("click", function (e) {
          if (!menu.classList.contains("is-open")) return;
          if (
            e.target === menu ||
            (!menu.contains(e.target) && !toggle.contains(e.target))
          )
            setOpen(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setOpen(false);
        });
        // 모바일 범위를 벗어나면 자동으로 닫기
        function onChange(e) {
          if (!e.matches) setOpen(false);
        }
        if (mq.addEventListener) mq.addEventListener("change", onChange);
        else mq.addListener(onChange);
      })();
    </script>
