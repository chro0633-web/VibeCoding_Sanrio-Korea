<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>산리오 코리아_SH</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
<div class="wrapper">
  <!-- 1. 상단영역 -->
  <header class="header-area">
    <div class="header-area-inner">
      <!-- 로고 이미지 박스 -->
      <div class="logo-box">
        <img src="./images/logo_2023.png" alt="산리오 코리아 로고">
      </div>
      <!-- 메뉴 리스트 -->
      <nav class="menu-list">
        <ul>
          <li><a href="#">company</a></li>
          <li><a href="#">character</a></li>
          <li><a href="#">place</a></li>
          <li><a href="#">recruit</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- 메인영역 -->
  <main class="main-area">
    <!-- 배경 스타일 사용법:
    background: 색 이 반 고 윙/크
    배경색 이미지 반복 고정 위치/크기 -->
    <!-- 1-1. 배너영역 -->
    <section class="banner-section">
      
        <div class="banner-inner">
          <img src="./images/main_visual_pc_v1.png" alt="메인 비주얼" class="banner-image">
        </div>
    <!-- SNS 이동 버튼 박스 -->
    <div class="sns">
      <a href="https://www.instagram.com/sanrio_kr/" target="_blank"><img src="./images/i_ins_pc_v3.png" alt="instargram"></a>
      <a href="https://www.youtube.com/c/sanriokorea/featured" target="_blank"><img src="./images/i_you_pc_v3.png" alt="youtube"></a>
    </div>

    </section>
    <!-- 1-2. 캐릭터영역 -->
    <section class="character-section"></section>
    <!-- 1-3. 컴퍼니영역 -->
    <section class="company-section"></section>
    <!-- 1-4. 리쿠르트영역 -->
    <section class="recruit-section"></section>
    <!-- 1-5. 플레이스영역 -->
    <section class="place-section"></section>
    <!-- 1-6. 컨텍어스영역 -->
    <section class="contactus-section"></section>
  </main>
  
 
  <!-- 3. 하단영역 -->
  <footer class="footer-area"></footer>
</div>
</body>
</html>
